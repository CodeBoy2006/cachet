<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cachet — film</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Ccircle cx='9' cy='12' r='6.5' stroke='%23edece7' stroke-width='1.8'/%3E%3Ccircle cx='15' cy='12' r='6.5' stroke='%23edece7' stroke-width='1.8'/%3E%3Cpath d='M12 6.234A6.5 6.5 0 0 1 12 17.766A6.5 6.5 0 0 1 12 6.234Z' fill='%230b7a55'/%3E%3C/svg%3E" />
    <style>
      @font-face {
        font-family: 'UI';
        src: url('/assets/fonts/geist.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'UI Mono';
        src: url('/assets/fonts/geist-mono.woff2') format('woff2');
        font-weight: 100 900;
      }
      :root {
        --fg: #edece7;
        --dim: rgba(237, 236, 231, 0.55);
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: var(--fg);
        font-family: 'UI', system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        background: #000;
      }
      body[data-idle] {
        cursor: none;
      }
      .ui {
        position: fixed;
        inset: auto 0 0 0;
        padding: 0 24px 18px;
        display: flex;
        align-items: center;
        gap: 16px;
        transition: opacity 400ms ease;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.5), transparent);
        padding-top: 48px;
      }
      body[data-idle] .ui,
      body[data-clean] .ui {
        opacity: 0;
        pointer-events: none;
      }
      .ui button {
        all: unset;
        cursor: pointer;
        color: var(--fg);
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        opacity: 0.85;
      }
      .ui button:hover {
        opacity: 1;
      }
      .ui button:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .bar {
        flex: 1;
        position: relative;
        height: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
      }
      .bar::before {
        content: '';
        position: absolute;
        inset: 8px 0;
        background: rgba(237, 236, 231, 0.18);
        border-radius: 1px;
      }
      .bar i {
        position: absolute;
        left: 0;
        top: 8px;
        height: 2px;
        background: var(--fg);
        border-radius: 1px;
      }
      .time {
        font: 500 12px 'UI Mono', ui-monospace, monospace;
        color: var(--dim);
        min-width: 92px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .play {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      .play button {
        all: unset;
        pointer-events: auto;
        cursor: pointer;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(12, 12, 11, 0.42);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(237, 236, 231, 0.22);
        transition: transform 200ms ease, opacity 300ms ease;
      }
      .play button:hover {
        transform: scale(1.05);
      }
      .play[hidden] {
        display: none;
      }
      .status {
        position: fixed;
        left: 50%;
        bottom: 34%;
        transform: translateX(-50%);
        font: 500 11px 'UI Mono', monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(29, 27, 24, 0.55);
        pointer-events: none;
        transition: opacity 400ms;
      }
      .debug {
        position: fixed;
        top: 12px;
        left: 12px;
        font: 500 12px 'UI Mono', monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.55);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
      }
      .debug[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="film"></canvas></div>
    <div class="play" id="playOverlay" hidden>
      <button id="bigPlay" aria-label="Play">
        <svg width="26" height="26" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="#edece7" /></svg>
      </button>
    </div>
    <div class="status" id="status">Preparing</div>
    <div class="ui" id="ui">
      <button id="toggle" aria-label="Play / pause"></button>
      <div class="bar" id="bar"><i id="fill"></i></div>
      <span class="time" id="time">0:00.0 / 1:02</span>
      <button id="mute" aria-label="Mute"></button>
      <button id="wav" aria-label="Download soundtrack" title="Download soundtrack (WAV)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7.5 8 11l3.5-3.5M3 13.5h10" /></svg>
      </button>
      <button id="full" aria-label="Fullscreen">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" /></svg>
      </button>
    </div>
    <div class="debug" id="debug" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
